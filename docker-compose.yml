name: agentic-merge-forensics

services:
  web:
    build:
      context: .
    image: agentic-merge-forensics:local
    ports:
      - "3737:3737"
    environment:
      # Clones, reports and state land on the volume below rather than in the
      # container's home, so they survive a rebuild. First run per repo is the
      # slow one; after that the mirror is fetched incrementally.
      MERGE_FORENSICS_HOME: /data
      # Passed through from your shell or a .env file. Without it the run still
      # produces every git-derived metric and records a warning.
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Local model that writes the executive summary. The dashboard works
      # without it — that one panel degrades and the numbers are unaffected.
      #
      # Routed through the local inference engine on its own `merge-forensics`
      # tenant, so this dashboard's usage is accounted separately and cannot
      # exhaust another product's scheduler slot. Needs a key — see the README
      # for the launch line that reads one out of the engine's .auth_keys.json.
      #
      # Ollama serves the same model directly at http://host.docker.internal:11434
      # with no key. For the default ministral-3:8b the two are about as fast
      # (~5s warm). Ollama only pulls ahead with a reasoning model like gemma4:
      # its API accepts `think: false`, which the engine's OpenAI path cannot.
      MERGE_FORENSICS_LLM_URL: ${MERGE_FORENSICS_LLM_URL:-http://host.docker.internal:8080/v1}
      MERGE_FORENSICS_LLM_MODEL: ${MERGE_FORENSICS_LLM_MODEL:-ministral-3:8b}
      MERGE_FORENSICS_LLM_KEY: ${MERGE_FORENSICS_LLM_KEY:-}
      # "ollama" or "openai"; inferred from the URL when unset.
      MERGE_FORENSICS_LLM_API: ${MERGE_FORENSICS_LLM_API:-}
      # The engine is slower per call than Ollama, so allow it more room.
      MERGE_FORENSICS_LLM_TIMEOUT_MS: ${MERGE_FORENSICS_LLM_TIMEOUT_MS:-60000}
    extra_hosts:
      # Docker Desktop provides this already; the mapping is for Linux hosts.
      - "host.docker.internal:host-gateway"
    volumes:
      - forensics-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3737/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The poller that keeps the activity feed current. Same image, same volume,
  # different entrypoint — it writes the event log that `web` only reads, which
  # is why it is a separate service rather than a thread inside the server:
  # Next.js can start several worker processes, and several pollers would each
  # spend the same API budget on the same repos.
  watcher:
    build:
      context: .
    image: agentic-merge-forensics:local
    # tsx directly rather than bin/merge-forensics.mjs, which resolves tsx from
    # ./node_modules — where a production install does not keep it.
    command: ["tsx", "src/cli/main.ts", "feed", "--watch"]
    environment:
      MERGE_FORENSICS_HOME: /data
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Seconds between cycles. Only repos whose pushed_at moved are polled, so
      # a quiet watchlist costs one API call per cycle.
      MERGE_FORENSICS_FEED_INTERVAL: ${MERGE_FORENSICS_FEED_INTERVAL:-60}
    volumes:
      - forensics-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  forensics-data:
